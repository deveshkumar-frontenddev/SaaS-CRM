<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real CRM Login</title>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script>
  const toggleBtn = document.getElementById('menuToggle');
  const sidebar = document.getElementById('sidebar');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('hidden');
  });
</script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
        }
        .login-box h2 { text-align: center; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .login-btn { background-color: #0f172a; }
        .signup-btn { background-color: #10b981; }
        .message { text-align: center; font-size: 14px; margin-top: 15px; color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>SaaS CRM Login</h2>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password (min 6 chars)">
        </div>
        
        <button class="btn login-btn" onclick="loginUser()">Log In</button>
        <button class="btn signup-btn" onclick="signupUser()">Create Account</button>
        
        <div class="message" id="msg"></div>
    </div>

    <script>
        // Aapke Firebase Dashboard se nikali gayi keys
        const firebaseConfig = {
            apiKey: "AIzaSyAGst4FREVaPqf9xaQb26_z0rXFBwQkR4I",
            authDomain: "crms-78a4b.firebaseapp.com",
            projectId: "crms-78a4b",
            storageBucket: "crms-78a4b.firebasestorage.app",
            messagingSenderId: "363195838529",
            appId: "1:363195838529:web:3b23c3a98767eac24456c0",
            measurementId: "G-DRCQWTF81J"
        };

        // Firebase start karna
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function showMessage(text, color) {
            const msgDiv = document.getElementById('msg');
            msgDiv.textContent = text;
            msgDiv.style.color = color;
        }

        function signupUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                showMessage("Account Ban Gaya! Ab Login karein.", "green");
            })
            .catch((error) => {
                showMessage(error.message, "red");
            });
        }

        function loginUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                showMessage("Login Successful! Redirecting...", "green");
                // YEH LINE AB DASHBOARD PAR LE JAYEGI
                window.location.href = "dashboard.html"; 
            })
            .catch((error) => {
                showMessage("Galat Email ya Password!", "red");
            });
        }
    </script>

</body>
</html>
