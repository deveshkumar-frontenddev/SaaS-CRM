<script>
        const toggleBtn = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        toggleBtn.addEventListener('click', () => {
            if (sidebar.style.width === '0px') {
                sidebar.style.width = '260px';
                sidebar.style.padding = '0';
            } else {
                sidebar.style.width = '0px';
            }
        });

        const modal = document.getElementById('leadModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const leadForm = document.getElementById('leadForm');
        const leadsTableBody = document.getElementById('leadsTableBody');
        const leadSource = document.getElementById('leadSource');
        const referenceBox = document.getElementById('referenceBox');

        const detailsModal = document.getElementById('detailsModal');
        const closeDetailsBtn = document.getElementById('closeDetailsBtn');
        const detailsContent = document.getElementById('detailsContent');

        leadSource.addEventListener('change', () => {
            if (leadSource.value === 'Reference') {
                referenceBox.style.display = 'block';
            } else {
                referenceBox.style.display = 'none';
            }
        });

        openModalBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        closeDetailsBtn.addEventListener('click', () => {
            detailsModal.style.display = 'none';
        });

        // Load leads from localStorage when page opens
        let leadsData = JSON.parse(localStorage.getItem('crm_leads')) || [];
        renderTable();

        leadForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('leadName').value;
            const phone = document.getElementById('leadPhone').value;
            const email = document.getElementById('leadEmail').value || 'N/A';
            const source = leadSource.value;

            let refData = { name: 'N/A', phone: 'N/A', email: 'N/A' };
            if (source === 'Reference') {
                refData.name = document.getElementById('refName').value || 'N/A';
                refData.phone = document.getElementById('refPhone').value || 'N/A';
                refData.email = document.getElementById('refEmail').value || 'N/A';
            }

            const newLead = { id: Date.now(), name, phone, email, source, refData };
            leadsData.push(newLead);
            
            // Save to localStorage
            localStorage.setItem('crm_leads', JSON.stringify(leadsData));
            renderTable();

            leadForm.reset();
            referenceBox.style.display = 'none';
            modal.style.display = 'none';
        });

        function renderTable() {
            leadsTableBody.innerHTML = '';

            if (leadsData.length === 0) {
                leadsTableBody.innerHTML = `<tr><td colspan="5" class="no-data">No leads found. Click "+ Add New Lead" to create one.</td></tr>`;
                return;
            }

            leadsData.forEach((lead) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: 600;">${lead.name}</td>
                    <td style="color: var(--text-muted);">${lead.phone}</td>
                    <td style="color: var(--text-muted);">${lead.email}</td>
                    <td>${lead.source}</td>
                    <td>
                        <button class="btn-action-view" onclick="viewDetails(${lead.id})">View Details</button>
                        <button class="btn-action-delete" onclick="deleteLead(${lead.id})">Delete</button>
                    </td>
                `;
                leadsTableBody.appendChild(row);
            });
        }

        function viewDetails(id) {
            const lead = leadsData.find(l => l.id === id);
            if (!lead) return;

            let html = `
                <div class="detail-row"><span>Full Name:</span> ${lead.name}</div>
                <div class="detail-row"><span>Mobile:</span> ${lead.phone}</div>
                <div class="detail-row"><span>Email:</span> ${lead.email}</div>
                <div class="detail-row"><span>Source:</span> ${lead.source}</div>
            `;

            if (lead.source === 'Reference') {
                html += `
                    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e2e8f0;">
                    <div class="detail-row" style="font-weight: bold; color: var(--navy-dark);">Referrer Information:</div>
                    <div class="detail-row"><span>Ref Name:</span> ${lead.refData.name}</div>
                    <div class="detail-row"><span>Ref Mobile:</span> ${lead.refData.phone}</div>
                    <div class="detail-row"><span>Ref Email:</span> ${lead.refData.email}</div>
                `;
            }

            detailsContent.innerHTML = html;
            detailsModal.style.display = 'flex';
        }

        function deleteLead(id) {
            leadsData = leadsData.filter(l => l.id !== id);
            // Update localStorage after deleting
            localStorage.setItem('crm_leads', JSON.stringify(leadsData));
            renderTable();
        }
    </script>
