<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS CRM - Clean Light Dashboard</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-primary: #0284c7; /* Professional Slate Sky Blue */
            --accent-hover: #0369a1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Minimalist Light Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .sidebar h2 {
            padding: 24px 20px;
            font-size: 1.15rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-primary);
            border-radius: 50%;
        }

        .sidebar a {
            padding: 14px 20px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar a:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .sidebar a.active {
            background-color: #f0f9ff;
            color: var(--accent-primary);
            font-weight: 600;
            border-right: 3px solid var(--accent-primary);
        }

        /* Main Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: var(--bg-main);
        }

        .topbar {
            height: 70px;
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 30px;
            justify-content: space-between;
        }

        .menu-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-toggle-btn:hover {
            background-color: #f1f5f9;
        }

        .content-body {
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .btn-add {
            background-color: var(--accent-primary);
            color: white;
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
            transition: 0.2s;
        }

        .btn-add:hover {
            background-color: var(--accent-hover);
        }

        /* Clean Card Table */
        .table-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        td {
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .badge-new {
            background-color: #ecfdf5;
            color: #059669;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <h2>SaaS CRM</h2>
        <a href="#" class="active">📊 Leads Manager</a>
        <a href="#">🚀 Campaigns</a>
        <a href="index.html" style="margin-top: auto; border-top: 1px solid var(--border-color); color: #dc2626;">🚪 Logout</a>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
        <div class="topbar">
            <button id="menuToggle" class="menu-toggle-btn">☰</button>
            <span style="font-weight: 500; color: var(--text-muted); font-size: 14px;">Workspace / <strong style="color: var(--text-main);">Leads</strong></span>
        </div>

        <div class="content-body">
            <div class="header">
                <h1>Leads Overview</h1>
                <button class="btn-add">+ New Lead</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Source</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="font-weight: 500;">Rahul Sharma</td>
                            <td style="color: var(--text-muted);">rahul@example.com</td>
                            <td style="color: var(--text-muted);">+91 9876543210</td>
                            <td>Google Ads</td>
                            <td><span class="badge-new">Active</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Toggle Script -->
    <script>
        const toggleBtn = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        toggleBtn.addEventListener('click', () => {
            if (sidebar.style.width === '0px') {
                sidebar.style.width = '260px';
                sidebar.style.padding = '0';
            } else {
                sidebar.style.width = '0px';
            }
        });
    </script>

</body>
</html>
